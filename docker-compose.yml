services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    ports: ["127.0.0.1:1883:1883"]
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: ${DB_NAME:-bfdb}
      POSTGRES_USER: ${DB_USER:-bfdb}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bfdb_dev}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${DB_USER:-bfdb} -d ${DB_NAME:-bfdb}"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  telemetry-gateway:
    build: .
    command: ["python","apps/telemetry-gateway/main.py"]
    environment:
      MQTT_HOST: ${MQTT_HOST:-mosquitto}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_TOPIC: ${MQTT_TOPIC:-data/dev/#}
      DB_HOST: ${DB_HOST:-timescaledb}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-bfdb}
      DB_USER: ${DB_USER:-bfdb}
      DB_PASSWORD: ${DB_PASSWORD:-bfdb_dev}
      MODBUS_HOST: ${MODBUS_HOST:-0.0.0.0}
      MODBUS_PORT: ${MODBUS_PORT:-1502}
      STALE_AFTER_SECONDS: ${STALE_AFTER_SECONDS:-15}
      HISTORY_API_HOST: ${HISTORY_API_HOST:-0.0.0.0}
      HISTORY_API_PORT: ${HISTORY_API_PORT:-8080}
    depends_on:
      timescaledb: {condition: service_healthy}
      mosquitto: {condition: service_started}
    ports: ["127.0.0.1:1502:1502", "127.0.0.1:18080:8080"]
    restart: unless-stopped

  field-emulator:
    build: .
    command: ["python","apps/field-emulator/main.py"]
    environment:
      MQTT_HOST: ${MQTT_HOST:-mosquitto}
      MQTT_PORT: ${MQTT_PORT:-1883}
    depends_on:
      mosquitto: {condition: service_started}
    restart: unless-stopped

volumes:
  mosquitto-data:
  timescale-data:
