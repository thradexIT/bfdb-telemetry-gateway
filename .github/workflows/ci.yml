name: CI
on:
  pull_request:
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -c "from pymodbus.server import StartAsyncTcpServer; from pymodbus.datastore import ModbusSlaveContext,ModbusServerContext; print('pymodbus imports OK')"
  snmp-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/snmp-emulator/package-lock.json
      - name: Install SNMP agent dependencies
        working-directory: apps/snmp-emulator
        run: npm ci --no-audit --no-fund
      - name: Model and real UDP SNMPv3 integration tests
        working-directory: apps/snmp-emulator
        run: npm test
      - name: Build opt-in SNMP Docker service
        run: docker build -f apps/snmp-emulator/Dockerfile -t bfdb-snmp-lab:ci .
      - name: Build private-evidence Smartpack2 snapshot service
        run: docker build -f apps/snmp-snapshot-emulator/Dockerfile -t bfdb-smartpack2-snapshot:ci .
      - name: Validate Telxius complete-data overlay
        env:
          MQTT_HOST: mqtt-broker.example.invalid
          TELXIUS_SNMP_EVIDENCE_DIR: /tmp/private-evidence
          TELXIUS_SNMP_COMMUNITY: ci-private-community
          TELXIUS_SITE_MAPPER_SNMP_HOST: site-mapper-snmp.example.invalid
        run: |
          node --check apps/snmp-emulator/telxius-snapshot-inform.mjs
          docker compose -f docker-compose.telxius-seed-01.yml \
            --profile telxius --profile telxius-site-mapper config >/dev/null
