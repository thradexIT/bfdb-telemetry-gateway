name: CI
on:
  pull_request:
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -c "from pymodbus.server import StartAsyncTcpServer; from pymodbus.datastore import ModbusSlaveContext,ModbusServerContext; print('pymodbus imports OK')"
