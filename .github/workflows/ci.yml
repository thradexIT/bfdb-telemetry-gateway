name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -c "from pymodbus.server import StartAsyncTcpServer; from pymodbus.datastore import ModbusSlaveContext,ModbusServerContext; print('pymodbus imports OK')"
  snmp-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/snmp-emulator/package-lock.json
      - name: Install SNMP agent dependencies
        working-directory: apps/snmp-emulator
        run: npm ci --no-audit --no-fund
      - name: Model and real UDP SNMPv3 integration tests
        working-directory: apps/snmp-emulator
        run: npm test
      - name: Build opt-in SNMP Docker service
        run: docker build -f apps/snmp-emulator/Dockerfile -t bfdb-snmp-lab:ci .
      - name: Build private-evidence Smartpack2 snapshot service
        run: docker build -f apps/snmp-snapshot-emulator/Dockerfile -t bfdb-smartpack2-snapshot:ci .
      - name: Exercise full Smartpack2 snapshot over real SNMPv2c
        run: |
          set -euo pipefail
          rm -rf /tmp/telxius-snmp-fixture
          mkdir -p /tmp/telxius-snmp-fixture
          cat >/tmp/telxius-snmp-fixture/test.mib <<'MIB'
          TELXIUS-TEST DEFINITIONS ::= BEGIN
          testRoot OBJECT IDENTIFIER ::= { enterprises 55555 }
          testValue OBJECT-TYPE
              SYNTAX Integer32
              MAX-ACCESS read-only
              STATUS current
              ::= { testRoot 1 }
          END
          MIB
          cat >/tmp/telxius-snmp-fixture/walk.txt <<'WALK'
          Sent GET request to 127.0.0.1 : 161
          testValue.0
          91
          .1.3.6.1.4.1.55555.99.0
          evidence-text
          Request Failed: end of Mib View
          WALK

          docker network create telxius-snmp-ci
          cleanup() {
            docker rm -f telxius-smartpack2-ci >/dev/null 2>&1 || true
            docker network rm telxius-snmp-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name telxius-smartpack2-ci --network telxius-snmp-ci \
            -e SNMP_WALK_FILE=/evidence/walk.txt \
            -e SNMP_MIB_FILES=/evidence/test.mib \
            -e SNMP_COMMUNITY=ci-private-community \
            -e SNMP_SIM_LOG_LEVEL=error \
            -v /tmp/telxius-snmp-fixture:/evidence:ro \
            bfdb-smartpack2-snapshot:ci
          sleep 3

          docker run --rm --network telxius-snmp-ci bfdb-snmp-lab:ci node - <<'NODE'
          const snmp = require('net-snmp');
          const session = snmp.createSession('telxius-smartpack2-ci', 'ci-private-community', {
            port: 1161,
            version: snmp.Version2c,
            timeout: 2000,
            retries: 2,
          });
          session.get([
            '1.3.6.1.4.1.55555.1.0',
            '1.3.6.1.4.1.55555.99.0',
          ], (error, values) => {
            if (error) {
              console.error(error);
              process.exitCode = 1;
            } else if (values[0].value !== 91 || values[1].value.toString() !== 'evidence-text') {
              console.error(values);
              process.exitCode = 1;
            } else {
              console.log('TELXIUS_FULL_SNAPSHOT_SNMPV2C_OK');
            }
            session.close();
          });
          NODE

      - name: Validate Telxius complete-data overlay
        env:
          MQTT_HOST: mqtt-broker.example.invalid
          TELXIUS_SNMP_EVIDENCE_DIR: /tmp/private-evidence
          TELXIUS_SNMP_COMMUNITY: ci-private-community
          TELXIUS_SITE_MAPPER_SNMP_HOST: site-mapper-snmp.example.invalid
        run: |
          node --check apps/snmp-emulator/telxius-snapshot-inform.mjs
          docker compose -f docker-compose.telxius-seed-01.yml \
            --profile telxius \
            --profile telxius-site-mapper \
            --profile telxius-client-parity \
            config >/dev/null
