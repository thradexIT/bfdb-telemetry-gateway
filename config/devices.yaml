version: "0.2"
profile: emulator-lab
devices:
  - bfdbId: BFDB-01
    serial: EMU-BFDB-01
    unitId: 1
    identity:
      mode: emulator_panelized
      pointRegex: "^0_([0-9]+)_([0-9]+)$"
      panelsPerBfdb: 4
      positionsPerPanel: 24
      minCircuit: 1
      maxCircuit: 96
      syntheticPanelOrder: [A1, A2, B1, B2]
    fields: {voltage: U1, current: I1, power: P1, energy: EP1}

  - bfdbId: BFDB-02
    serial: EMU-BFDB-02
    unitId: 2
    identity:
